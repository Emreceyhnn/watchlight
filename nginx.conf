limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ingest:10m rate=50r/s;

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    server_name localhost watchlight.emreceyhan.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost watchlight.emreceyhan.xyz;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 1M;

    # Güvenlik başlıkları (uygulama katmanındaki middleware ile aynı politika)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Next.js statik dosyaları
    location /_next/static/ {
        proxy_pass http://web:3000/_next/static/;
        proxy_cache_valid 200 365d;
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Harici log toplayıcıların event gönderdiği uç nokta (statik API key ile korunur)
    location /api/ingest {
        limit_req zone=ingest burst=20 nodelay;
        proxy_pass http://web:3000/api/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gerçek Zamanlı SSE / Stream Endpoint (Buffering kapatılmalıdır)
    # Erişim token'ı query param'da taşındığından access log'a yazılmaz.
    location /api/stream {
        access_log off;
        proxy_pass http://web:3000/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Genel Web Proxy
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
