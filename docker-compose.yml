version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: watchlight-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watchlight_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-watchlight_soc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-watchlight_user} -d ${POSTGRES_DB:-watchlight_soc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: watchlight-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: watchlight-web
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-watchlight_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchlight_soc}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      INGEST_API_KEY: ${INGEST_API_KEY}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      PORT: "3000"
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: watchlight-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-watchlight_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-watchlight_soc}?schema=public"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  simulator:
    build:
      context: .
      dockerfile: Dockerfile
      target: simulator
    container_name: watchlight-simulator
    restart: on-failure
    environment:
      INGEST_URL: "http://web:3000/api/ingest"
      INGEST_API_KEY: ${INGEST_API_KEY}
    networks:
      - internal
    depends_on:
      - web
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  nginx:
    image: nginx:alpine
    container_name: watchlight-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - edge
    depends_on:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres_data:
  redis_data:
