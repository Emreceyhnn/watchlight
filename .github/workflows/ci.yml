name: CI/CD Pipeline & Automated Server Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.25.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @watchlight/db db:generate

      - name: Run ESLint
        run: pnpm turbo run lint

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Verify Monorepo Build
        run: pnpm run build

  build-and-push-images:
    name: Build & Push Docker Images to GHCR
    needs: [test-and-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$REPO_LOWER" >> $GITHUB_OUTPUT

      - name: Build and Push Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/web:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/worker:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/worker:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Migration Container
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/db-migrate:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/db-migrate:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Continuous Deployment to Production Server
    needs: [build-and-push-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment for Watchlight..."
            
            APP_DIR="${{ secrets.SERVER_APP_DIR || '/opt/watchlight' }}"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"
            
            # Gerekirse git reposunu clone/pull et
            if [ -d ".git" ]; then
              echo "Pulling latest code changes..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi

            # GHCR Login (Private image çekebilmek için)
            echo "${{ secrets.DEPLOY_GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Gerekirse self-signed sertifika oluştur
            if [ ! -f "certs/fullchain.pem" ]; then
              sh scripts/generate-certs.sh || true
            fi

            # En güncel Docker imajlarını çek ve servisleri ayağa kaldır
            echo "Pulling latest containers and restarting stack..."
            docker compose pull || true
            docker compose up -d --build --remove-orphans

            # Kullanılmayan eski Docker imajlarını temizle
            docker image prune -af --filter "until=72h"

            echo "✅ Deployment completed successfully!"
