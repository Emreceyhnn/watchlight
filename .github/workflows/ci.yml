name: CI/CD Pipeline & Automated Server Deployment

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.25.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @watchlight/db db:generate

      - name: Run ESLint
        run: pnpm turbo run lint

      - name: Run Vitest Unit Tests
        run: npx vitest run

      - name: Verify Monorepo Build
        run: pnpm run build

  build-and-push-images:
    name: Build & Push Docker Images to Docker Hub
    needs: [test-and-lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Web Container
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/watchlight-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/watchlight-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Worker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/watchlight-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/watchlight-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-server:
    name: Continuous Deployment to Production Server
    needs: [build-and-push-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting automated deployment for Watchlight..."
            
            APP_DIR="${{ secrets.SERVER_APP_DIR || '/home/watchlight' }}"
            cd "$APP_DIR"
            
            echo "Pulling latest Docker Hub images..."
            docker compose pull
            
            echo "Starting containers with resource constraints..."
            docker compose up -d --remove-orphans
            
            echo "Pruning dangling docker images..."
            docker image prune -f
            
            echo "✅ Watchlight deployed successfully!"
