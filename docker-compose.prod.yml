services:
  db-init:
    image: emrecyhn/watchlight-worker:${IMAGE_TAG:?set IMAGE_TAG, e.g. 312bf05-202611041702}
    container_name: watchlight-db-init
    restart: "no"
    command: ["sh", "./scripts/db-init.sh"]
    env_file:
      - .env
    networks:
      - gateway-network

  web:
    image: emrecyhn/watchlight-web:${IMAGE_TAG:?set IMAGE_TAG, e.g. 312bf05-202611041702}
    container_name: watchlight-web
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - gateway-network
    depends_on:
      - db-init
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 240M
        reservations:
          memory: 64M

  worker:
    image: emrecyhn/watchlight-worker:${IMAGE_TAG:?set IMAGE_TAG, e.g. 312bf05-202611041702}
    container_name: watchlight-worker
    restart: always
    env_file:
      - .env
    networks:
      - gateway-network
    depends_on:
      - db-init
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 180M
        reservations:
          memory: 48M

networks:
  gateway-network:
    name: gateway-network
    external: true

