services:
  db-init:
    image: emrecyhn/watchlight-worker:latest
    container_name: watchlight-db-init
    restart: "no"
    command: ["sh", "-c", "node -e 'const { execSync } = require(\"child_process\"); try { execSync(\"npx prisma db push --schema packages/db/prisma/schema.prisma --accept-data-loss\", { stdio: \"inherit\" }); execSync(\"npx tsx packages/db/prisma/seed.ts\", { stdio: \"inherit\" }); } catch(e) { console.error(e); }'"]
    env_file:
      - .env
    networks:
      - gateway-network

  web:
    image: emrecyhn/watchlight-web:latest
    container_name: watchlight-web
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - gateway-network
    depends_on:
      - db-init
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 240M
        reservations:
          memory: 64M

  worker:
    image: emrecyhn/watchlight-worker:latest
    container_name: watchlight-worker
    restart: always
    env_file:
      - .env
    networks:
      - gateway-network
    depends_on:
      - db-init
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 180M
        reservations:
          memory: 48M

networks:
  gateway-network:
    name: gateway-network
    external: true

